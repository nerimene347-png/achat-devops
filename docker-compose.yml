
services:
  postgresdb:
    image: postgres:13
    restart: unless-stopped
    environment:
      - POSTGRES_DB=achat_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db:/var/lib/postgresql/data

  app-achat:
    depends_on:
      - postgresdb
    image: narimen123/achat-server:1.0.0
    restart: on-failure
    ports:
      - "8089:8080"
    environment:
      - DB_SERVER=postgresdb
      - DB_PORT=5432
      - POSTGRES_DB=achat_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    stdin_open: true
    tty: true

volumes:
  db:
